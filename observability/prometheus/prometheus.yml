global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexofiscal-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bff-service:8083
          - tenant-service:8084
          - catalog-service:8085
          - thirdparty-service:8086
          - inventory-service:8087
          - billing-service:8088
          - accounting-service:8090
          - audit-service:8091
          - identity-service:8092
          - payroll-service:8093
          - reporting-service:8094
