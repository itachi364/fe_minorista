groups:
  - name: nexofiscal-platform
    rules:
      - alert: NexoFiscalServiceDown
        expr: up{job="nexofiscal-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servicio NexoFiscal sin metricas"
          description: "{{ $labels.instance }} no responde al scraping de Prometheus."

      - alert: NexoFiscalHighServerErrors
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Errores 5xx elevados"
          description: "{{ $labels.application }} supera el umbral de errores tecnicos."
