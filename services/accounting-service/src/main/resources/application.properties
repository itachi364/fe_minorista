server.port=${SERVER_PORT:${ACCOUNTING_SERVICE_PORT:8090}}
spring.application.name=accounting-service

spring.datasource.url=${ACCOUNTING_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${ACCOUNTING_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${ACCOUNTING_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=accounting
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=accounting
spring.flyway.default-schema=accounting
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Event-driven dispatch is disabled locally by default. Enable in AWS runtime only.
eventing.aws.eventbridge.enabled=${EVENTING_EVENTBRIDGE_ENABLED:false}
eventing.aws.region=${AWS_REGION:us-east-1}
eventing.aws.event-bus-name=${EVENTING_EVENT_BUS_NAME:facturaelectronica-dev-events}
eventing.outbox.initial-delay-ms=${EVENTING_OUTBOX_INITIAL_DELAY_MS:5000}
eventing.outbox.fixed-delay-ms=${EVENTING_OUTBOX_FIXED_DELAY_MS:5000}
eventing.outbox.batch-size=${EVENTING_OUTBOX_BATCH_SIZE:25}
eventing.outbox.max-attempts=${EVENTING_OUTBOX_MAX_ATTEMPTS:5}
