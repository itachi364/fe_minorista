server.port=${SERVER_PORT:${THIRDPARTY_SERVICE_PORT:8086}}
spring.application.name=thirdparty-service

spring.datasource.url=${THIRDPARTY_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${THIRDPARTY_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${THIRDPARTY_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${THIRDPARTY_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${THIRDPARTY_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${THIRDPARTY_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${THIRDPARTY_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${THIRDPARTY_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=thirdparty
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=thirdparty
spring.flyway.default-schema=thirdparty
spring.flyway.create-schemas=true


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
