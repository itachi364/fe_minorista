server.port=${SERVER_PORT:${AUDIT_SERVICE_PORT:8091}}
spring.application.name=audit-service

spring.datasource.url=${AUDIT_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${AUDIT_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${AUDIT_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=audit
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=audit
spring.flyway.default-schema=audit
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
