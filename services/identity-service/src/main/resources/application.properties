server.port=${SERVER_PORT:${IDENTITY_SERVICE_PORT:8092}}
spring.application.name=identity-service

spring.datasource.url=${IDENTITY_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${IDENTITY_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${IDENTITY_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${IDENTITY_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${IDENTITY_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${IDENTITY_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${IDENTITY_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${IDENTITY_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=identity
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.create-schemas=true

identity.session.duration-hours=${IDENTITY_SESSION_DURATION_HOURS:12}
identity.tenant-service-url=${TENANT_SERVICE_URL:http://localhost:8084}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.observations.key-values.application=${spring.application.name}
management.info.env.enabled=true
identity.root-user.seed-enabled=${IDENTITY_ROOT_USER_SEED_ENABLED:false}
identity.root-user.email=${IDENTITY_ROOT_USER_EMAIL:}
identity.root-user.full-name=${IDENTITY_ROOT_USER_FULL_NAME:Root Platform User}
identity.root-user.password=${IDENTITY_ROOT_USER_PASSWORD:}
