server.port=${SERVER_PORT:${IDENTITY_SERVICE_PORT:8092}}
spring.application.name=identity-service

spring.datasource.url=${IDENTITY_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${IDENTITY_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${IDENTITY_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=identity
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.create-schemas=true

identity.session.duration-hours=${IDENTITY_SESSION_DURATION_HOURS:12}
identity.tenant-service-url=${TENANT_SERVICE_URL:http://localhost:8084}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
