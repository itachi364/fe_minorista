server.port=${SERVER_PORT:${TENANT_SERVICE_PORT:8084}}
spring.application.name=tenant-service

spring.datasource.url=${TENANT_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${TENANT_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${TENANT_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${TENANT_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${TENANT_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${TENANT_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${TENANT_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${TENANT_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=tenant

spring.flyway.schemas=tenant
spring.flyway.default-schema=tenant
spring.flyway.create-schemas=true

spring.servlet.multipart.max-file-size=${TENANT_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${TENANT_BRANDING_MAX_REQUEST_SIZE:6MB}
tenant.branding.storage-path=${TENANT_BRANDING_STORAGE_PATH:${java.io.tmpdir}/nexofiscal/tenant-branding}
tenant.files.storage-path=${TENANT_FILES_STORAGE_PATH:${java.io.tmpdir}/nexofiscal/company-files}
tenant.files.storage-provider=${TENANT_FILES_STORAGE_PROVIDER:local}
tenant.files.s3.bucket=${TENANT_FILES_S3_BUCKET:}
tenant.files.s3.region=${TENANT_FILES_S3_REGION:${AWS_REGION:us-east-1}}
tenant.files.s3.kms-key-id=${TENANT_FILES_S3_KMS_KEY_ID:}
tenant.files.download-ttl-seconds=${TENANT_FILES_DOWNLOAD_TTL_SECONDS:300}
tenant.files.download-token-secret=${TENANT_FILES_DOWNLOAD_TOKEN_SECRET:local-development-download-token-secret-change-me}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.observations.key-values.application=${spring.application.name}
management.info.env.enabled=true
