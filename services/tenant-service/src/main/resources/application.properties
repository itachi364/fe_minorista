server.port=${SERVER_PORT:${TENANT_SERVICE_PORT:8084}}
spring.application.name=tenant-service

spring.datasource.url=${TENANT_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${TENANT_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${TENANT_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${TENANT_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${TENANT_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${TENANT_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${TENANT_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${TENANT_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=tenant

spring.flyway.schemas=tenant
spring.flyway.default-schema=tenant
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health
