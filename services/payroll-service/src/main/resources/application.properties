spring.application.name=payroll-service
server.port=${SERVER_PORT:8093}

spring.datasource.url=${PAYROLL_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${PAYROLL_DB_USERNAME:${DB_USERNAME:facturaelectronica}}
spring.datasource.password=${PAYROLL_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.hikari.maximum-pool-size=${PAYROLL_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${PAYROLL_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${PAYROLL_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${PAYROLL_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${PAYROLL_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=payroll
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.schemas=payroll
spring.flyway.default-schema=payroll
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

services.accounting.base-url=${ACCOUNTING_SERVICE_URL:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.observations.key-values.application=${spring.application.name}
management.info.env.enabled=true
