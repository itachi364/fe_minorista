server.port=${SERVER_PORT:${BFF_SERVICE_PORT:8083}}
spring.application.name=bff-service

bff.services.tenant-url=${TENANT_SERVICE_URL:http://localhost:8084}
bff.services.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8092}
bff.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8085}
bff.services.thirdparty-url=${THIRDPARTY_SERVICE_URL:http://localhost:8086}
bff.services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8087}
bff.services.billing-url=${BILLING_SERVICE_URL:http://localhost:8088}
bff.services.accounting-url=${ACCOUNTING_SERVICE_URL:http://localhost:8090}
bff.services.payroll-url=${PAYROLL_SERVICE_URL:http://localhost:8093}
bff.services.reporting-url=${REPORTING_SERVICE_URL:http://localhost:8094}
bff.services.dian-provider-url=${DIAN_PROVIDER_SERVICE_URL:http://localhost:8089}
bff.services.audit-url=${AUDIT_SERVICE_URL:http://localhost:8091}

spring.datasource.url=${BFF_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${BFF_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${BFF_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${BFF_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${BFF_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${BFF_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${BFF_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${BFF_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.flyway.schemas=bff
spring.flyway.default-schema=bff
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

bff.auth.mode=${AUTH_MODE:local}
bff.auth.environment=${APP_ENV:local}
bff.auth.cognito-base-url=${COGNITO_BASE_URL:}
bff.auth.cognito-client-id=${COGNITO_CLIENT_ID:}
bff.auth.cognito-redirect-uri=${COGNITO_REDIRECT_URI:http://localhost:8083/api/v1/auth/callback}
bff.auth.cognito-logout-uri=${COGNITO_LOGOUT_URI:http://localhost:5173}
bff.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
bff.auth.session-encryption-key=${BFF_SESSION_ENCRYPTION_KEY:}
bff.auth.cookie-secure=${BFF_COOKIE_SECURE:false}
bff.auth.cookie-same-site=${BFF_COOKIE_SAME_SITE:Strict}
bff.auth.csrf-enabled=${BFF_CSRF_ENABLED:false}
bff.auth.session-store=${BFF_SESSION_STORE:jdbc}
