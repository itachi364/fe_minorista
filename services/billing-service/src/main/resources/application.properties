server.port=${SERVER_PORT:${BILLING_SERVICE_PORT:8088}}
spring.application.name=billing-service

spring.datasource.url=${BILLING_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${BILLING_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${BILLING_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${BILLING_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${BILLING_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${BILLING_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${BILLING_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${BILLING_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=billing
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=billing
spring.flyway.default-schema=billing
spring.flyway.create-schemas=true

billing.inventory-service-url=${INVENTORY_SERVICE_URL:http://localhost:8087}
billing.provider-service-url=${DIAN_PROVIDER_SERVICE_URL:http://localhost:8089}
billing.accounting-service-url=${ACCOUNTING_SERVICE_URL:http://localhost:8090}
billing.audit-service-url=${AUDIT_SERVICE_URL:http://localhost:8091}
billing.tenant-service-url=${TENANT_SERVICE_URL:http://localhost:8084}
billing.identity-service-url=${IDENTITY_SERVICE_URL:http://localhost:8092}
billing.mock-provider-default-status=${DIAN_MOCK_DEFAULT_STATUS:ACCEPTED}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.observations.key-values.application=${spring.application.name}
management.info.env.enabled=true

# Event-driven dispatch is disabled locally by default. Enable in AWS runtime only.
eventing.aws.eventbridge.enabled=${EVENTING_EVENTBRIDGE_ENABLED:false}
eventing.aws.region=${AWS_REGION:us-east-1}
eventing.aws.event-bus-name=${EVENTING_EVENT_BUS_NAME:facturaelectronica-dev-events}
eventing.outbox.initial-delay-ms=${EVENTING_OUTBOX_INITIAL_DELAY_MS:5000}
eventing.outbox.fixed-delay-ms=${EVENTING_OUTBOX_FIXED_DELAY_MS:5000}
eventing.outbox.batch-size=${EVENTING_OUTBOX_BATCH_SIZE:25}
eventing.outbox.max-attempts=${EVENTING_OUTBOX_MAX_ATTEMPTS:5}
