server.port=${SERVER_PORT:${DIAN_PROVIDER_SERVICE_PORT:8089}}
spring.application.name=dian-provider-service

spring.datasource.url=${DIAN_PROVIDER_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${DIAN_PROVIDER_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${DIAN_PROVIDER_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DIAN_PROVIDER_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${DIAN_PROVIDER_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${DIAN_PROVIDER_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${DIAN_PROVIDER_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${DIAN_PROVIDER_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=dian_provider
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=dian_provider
spring.flyway.default-schema=dian_provider
spring.flyway.create-schemas=true

dian-provider.mode=${DIAN_PROVIDER_MODE:mock}
dian-provider.mock-default-status=${DIAN_MOCK_DEFAULT_STATUS:ACCEPTED}
dian-provider.mock-error-code=${DIAN_MOCK_ERROR_CODE:}
dian-provider.mock-error-message=${DIAN_MOCK_ERROR_MESSAGE:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
