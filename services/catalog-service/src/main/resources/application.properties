server.port=${SERVER_PORT:${CATALOG_SERVICE_PORT:8085}}
spring.application.name=catalog-service

spring.datasource.url=${CATALOG_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${CATALOG_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${CATALOG_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
