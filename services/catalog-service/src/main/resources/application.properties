server.port=${SERVER_PORT:${CATALOG_SERVICE_PORT:8085}}
spring.application.name=catalog-service

spring.datasource.url=${CATALOG_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${CATALOG_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${CATALOG_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${CATALOG_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${CATALOG_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${CATALOG_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${CATALOG_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${CATALOG_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
