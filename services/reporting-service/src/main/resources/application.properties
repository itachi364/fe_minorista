server.port=${SERVER_PORT:${REPORTING_SERVICE_PORT:8094}}
spring.application.name=reporting-service

spring.datasource.url=${REPORTING_DB_URL:${DB_URL:jdbc:postgresql://localhost:15432/facturaelectronica}}
spring.datasource.username=${REPORTING_DB_USERNAME:${DB_USERNAME:factura_user}}
spring.datasource.password=${REPORTING_DB_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${REPORTING_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:3}}
spring.datasource.hikari.minimum-idle=${REPORTING_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
spring.datasource.hikari.connection-timeout=${REPORTING_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
spring.datasource.hikari.idle-timeout=${REPORTING_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
spring.datasource.hikari.max-lifetime=${REPORTING_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:300000}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=reporting
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=reporting
spring.flyway.default-schema=reporting
spring.flyway.create-schemas=true

reporting.services.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8092}
reporting.services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8087}
reporting.services.billing-url=${BILLING_SERVICE_URL:http://localhost:8088}
reporting.services.accounting-url=${ACCOUNTING_SERVICE_URL:http://localhost:8090}
reporting.services.payroll-url=${PAYROLL_SERVICE_URL:http://localhost:8093}
reporting.services.tenant-url=${TENANT_SERVICE_URL:http://localhost:8084}

reporting.exports.app-public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
reporting.exports.local-storage-path=${REPORT_EXPORT_LOCAL_STORAGE_PATH:var/report-exports}
reporting.exports.download-presigned-ttl-seconds=${REPORT_DOWNLOAD_PRESIGNED_TTL_SECONDS:5}
reporting.exports.link-token-ttl-hours=${REPORT_LINK_TOKEN_TTL_HOURS:72}
reporting.exports.retention-days=${REPORT_EXPORT_RETENTION_DAYS:7}
reporting.exports.worker-enabled=${REPORT_EXPORT_WORKER_ENABLED:true}
reporting.exports.worker-fixed-delay-ms=${REPORT_EXPORT_WORKER_FIXED_DELAY_MS:5000}
reporting.exports.batch-size=${REPORT_EXPORT_BATCH_SIZE:5}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.observations.key-values.application=${spring.application.name}
management.info.env.enabled=true
