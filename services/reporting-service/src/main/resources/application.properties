server.port=${SERVER_PORT:${REPORTING_SERVICE_PORT:8094}}
spring.application.name=reporting-service

reporting.services.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8092}
reporting.services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8087}
reporting.services.billing-url=${BILLING_SERVICE_URL:http://localhost:8088}
