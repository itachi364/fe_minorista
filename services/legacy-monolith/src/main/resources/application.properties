server.port=${SERVER_PORT:8083}
spring.application.name=legacy-monolith
# Configuracion de PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Configuracion adicional del DataSource
spring.datasource.driver-class-name=org.postgresql.Driver
# Mostrar las consultas SQL generadas (opcional)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
dian.provider.mode=${DIAN_PROVIDER_MODE:mock}
dian.mock.default-status=${DIAN_MOCK_DEFAULT_STATUS:ACCEPTED}
dian.mock.error-code=${DIAN_MOCK_ERROR_CODE:}
dian.mock.error-message=${DIAN_MOCK_ERROR_MESSAGE:}
#MicroProductos
microservicio.productos.url=http://localhost:8083/api/productos
microservicio.proveedores.url=http://localhost:8083/api/proveedores
microservicio.tipodocumento.url=http://localhost:8083/api/tipos-documento
