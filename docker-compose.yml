    image: node:20-alpine
    container_name: facturaelectronica-frontend
    working_dir: /workspace/apps/facturaelectronica-web
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_BFF_BASE_URL: http://bff-service:${BFF_SERVICE_PORT:-8083}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/apps/facturaelectronica-web/node_modules
    command: ["sh", "-c", "npm install && npm run dev"]
volumes:
  postgres_data:
  maven_cache:
  frontend_node_modules:
