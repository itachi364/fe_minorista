        condition: service_healthy

  billing-service:
    image: eclipse-temurin:17-jdk
    container_name: facturaelectronica-billing-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${BILLING_SERVICE_PORT:-8088}
      BILLING_DB_URL: ${BILLING_DB_URL:-${DB_URL}}
      BILLING_DB_USERNAME: ${BILLING_DB_USERNAME:-${DB_USERNAME}}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:-${DB_PASSWORD}}
      EVENTING_EVENTBRIDGE_ENABLED: ${EVENTING_EVENTBRIDGE_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      EVENTING_EVENT_BUS_NAME: ${EVENTING_EVENT_BUS_NAME:-facturaelectronica-dev-events}
      EVENTING_OUTBOX_INITIAL_DELAY_MS: ${EVENTING_OUTBOX_INITIAL_DELAY_MS:-5000}
      EVENTING_OUTBOX_FIXED_DELAY_MS: ${EVENTING_OUTBOX_FIXED_DELAY_MS:-5000}
      EVENTING_OUTBOX_BATCH_SIZE: ${EVENTING_OUTBOX_BATCH_SIZE:-25}
      EVENTING_OUTBOX_MAX_ATTEMPTS: ${EVENTING_OUTBOX_MAX_ATTEMPTS:-5}
      INVENTORY_SERVICE_URL: http://inventory-service:${INVENTORY_SERVICE_PORT:-8087}
      DIAN_PROVIDER_SERVICE_URL: http://dian-provider-service:${DIAN_PROVIDER_SERVICE_PORT:-8089}
      ACCOUNTING_SERVICE_URL: http://accounting-service:${ACCOUNTING_SERVICE_PORT:-8090}
      AUDIT_SERVICE_URL: http://audit-service:${AUDIT_SERVICE_PORT:-8091}
      TENANT_SERVICE_URL: http://tenant-service:${TENANT_SERVICE_PORT:-8084}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${BILLING_SERVICE_PORT:-8088}:${BILLING_SERVICE_PORT:-8088}"
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: ["sh", "-c", "./mvnw -q -N -DskipTests install && ./mvnw -q -pl services/platform-eventing -DskipTests install && ./mvnw -pl services/billing-service -DskipTests spring-boot:run"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BILLING_SERVICE_PORT:-8088}/actuator/health >/dev/null 2>&1 || exit 1"]
