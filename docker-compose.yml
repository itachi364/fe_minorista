    command: ["sh", "./mvnw", "-pl", "services/thirdparty-service", "clean", "spring-boot:run"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${THIRDPARTY_SERVICE_PORT:-8086}/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
