services:
  postgres:
    image: postgres:16-alpine
    container_name: facturaelectronica-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tenant-service:
    image: eclipse-temurin:17-jdk
    container_name: facturaelectronica-tenant-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${TENANT_SERVICE_PORT:-8084}
      TENANT_DB_URL: ${TENANT_DB_URL:-${DB_URL}}
      TENANT_DB_USERNAME: ${TENANT_DB_USERNAME:-${DB_USERNAME}}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-${DB_PASSWORD}}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${TENANT_SERVICE_PORT:-8084}:${TENANT_SERVICE_PORT:-8084}"
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: ["sh", "./mvnw", "-pl", "services/tenant-service", "clean", "spring-boot:run"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${TENANT_SERVICE_PORT:-8084}/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy


  identity-service:
    image: eclipse-temurin:17-jdk
    container_name: facturaelectronica-identity-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${IDENTITY_SERVICE_PORT:-8092}
      IDENTITY_DB_URL: ${IDENTITY_DB_URL:-${DB_URL}}
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:-${DB_USERNAME}}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-${DB_PASSWORD}}
      TENANT_SERVICE_URL: http://tenant-service:${TENANT_SERVICE_PORT:-8084}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${IDENTITY_SERVICE_PORT:-8092}:${IDENTITY_SERVICE_PORT:-8092}"
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: ["sh", "./mvnw", "-pl", "services/identity-service", "clean", "spring-boot:run"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${IDENTITY_SERVICE_PORT:-8092}/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
  catalog-service:
    image: eclipse-temurin:17-jdk
    container_name: facturaelectronica-catalog-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${CATALOG_SERVICE_PORT:-8085}
      CATALOG_DB_URL: ${CATALOG_DB_URL:-${DB_URL}}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-${DB_USERNAME}}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-${DB_PASSWORD}}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${CATALOG_SERVICE_PORT:-8085}:${CATALOG_SERVICE_PORT:-8085}"
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: ["sh", "./mvnw", "-pl", "services/catalog-service", "clean", "spring-boot:run"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CATALOG_SERVICE_PORT:-8085}/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  thirdparty-service:
    image: eclipse-temurin:17-jdk
    container_name: facturaelectronica-thirdparty-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${THIRDPARTY_SERVICE_PORT:-8086}
      THIRDPARTY_DB_URL: ${THIRDPARTY_DB_URL:-${DB_URL}}
      THIRDPARTY_DB_USERNAME: ${THIRDPARTY_DB_USERNAME:-${DB_USERNAME}}
      THIRDPARTY_DB_PASSWORD: ${THIRDPARTY_DB_PASSWORD:-${DB_PASSWORD}}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${THIRDPARTY_SERVICE_PORT:-8086}:${THIRDPARTY_SERVICE_PORT:-8086}"
    volumes:
