services:
  postgres:
    image: postgres:16-alpine
    container_name: facturaelectronica-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tenant-service:
    image: eclipse-temurin:17-jdk
    container_name: facturaelectronica-tenant-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${TENANT_SERVICE_PORT:-8084}
      TENANT_DB_URL: ${TENANT_DB_URL:-${DB_URL}}
      TENANT_DB_USERNAME: ${TENANT_DB_USERNAME:-${DB_USERNAME}}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-${DB_PASSWORD}}
      TENANT_DB_POOL_MAX_SIZE: ${TENANT_DB_POOL_MAX_SIZE:-${DB_POOL_MAX_SIZE:-3}}
      TENANT_DB_POOL_MIN_IDLE: ${TENANT_DB_POOL_MIN_IDLE:-${DB_POOL_MIN_IDLE:-0}}
      TENANT_DB_CONNECTION_TIMEOUT_MS: ${TENANT_DB_CONNECTION_TIMEOUT_MS:-${DB_CONNECTION_TIMEOUT_MS:-10000}}
      TENANT_DB_IDLE_TIMEOUT_MS: ${TENANT_DB_IDLE_TIMEOUT_MS:-${DB_IDLE_TIMEOUT_MS:-60000}}
      TENANT_DB_MAX_LIFETIME_MS: ${TENANT_DB_MAX_LIFETIME_MS:-${DB_MAX_LIFETIME_MS:-300000}}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${TENANT_SERVICE_PORT:-8084}:${TENANT_SERVICE_PORT:-8084}"
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: ["sh", "./mvnw", "-pl", "services/tenant-service", "clean", "spring-boot:run"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${TENANT_SERVICE_PORT:-8084}/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy


