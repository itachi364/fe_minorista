  inventory-service:
    image: eclipse-temurin:17-jdk
    container_name: facturaelectronica-inventory-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${INVENTORY_SERVICE_PORT:-8087}
      INVENTORY_DB_URL: ${INVENTORY_DB_URL:-${DB_URL}}
      INVENTORY_DB_USERNAME: ${INVENTORY_DB_USERNAME:-${DB_USERNAME}}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-${DB_PASSWORD}}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      EVENTING_EVENTBRIDGE_ENABLED: ${EVENTING_EVENTBRIDGE_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      EVENTING_EVENT_BUS_NAME: ${EVENTING_EVENT_BUS_NAME:-facturaelectronica-dev-events}
      EVENTING_OUTBOX_INITIAL_DELAY_MS: ${EVENTING_OUTBOX_INITIAL_DELAY_MS:-5000}
      EVENTING_OUTBOX_FIXED_DELAY_MS: ${EVENTING_OUTBOX_FIXED_DELAY_MS:-5000}
      EVENTING_OUTBOX_BATCH_SIZE: ${EVENTING_OUTBOX_BATCH_SIZE:-25}
      EVENTING_OUTBOX_MAX_ATTEMPTS: ${EVENTING_OUTBOX_MAX_ATTEMPTS:-5}
    ports:
      - "${INVENTORY_SERVICE_PORT:-8087}:${INVENTORY_SERVICE_PORT:-8087}"
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: ["sh", "-c", "./mvnw -q -N -DskipTests install && ./mvnw -q -pl services/platform-eventing -DskipTests install && ./mvnw -pl services/inventory-service -DskipTests spring-boot:run"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${INVENTORY_SERVICE_PORT:-8087}/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
