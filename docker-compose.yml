    container_name: facturaelectronica-dian-provider-service
    working_dir: /workspace
    environment:
      SERVER_PORT: ${DIAN_PROVIDER_SERVICE_PORT:-8089}
      DIAN_PROVIDER_DB_URL: ${DIAN_PROVIDER_DB_URL:-${DB_URL}}
      DIAN_PROVIDER_DB_USERNAME: ${DIAN_PROVIDER_DB_USERNAME:-${DB_USERNAME}}
      DIAN_PROVIDER_DB_PASSWORD: ${DIAN_PROVIDER_DB_PASSWORD:-${DB_PASSWORD}}
      DIAN_PROVIDER_MODE: ${DIAN_PROVIDER_MODE:-mock}
      DIAN_MOCK_DEFAULT_STATUS: ${DIAN_MOCK_DEFAULT_STATUS:-ACCEPTED}
      DIAN_MOCK_ERROR_CODE: ${DIAN_MOCK_ERROR_CODE:-}
      DIAN_MOCK_ERROR_MESSAGE: ${DIAN_MOCK_ERROR_MESSAGE:-}
