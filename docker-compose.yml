      AUDIT_DB_URL: ${AUDIT_DB_URL:-${DB_URL}}
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME:-${DB_USERNAME}}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-${DB_PASSWORD}}
