name: quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and coverage
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/facturaelectronica-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/facturaelectronica-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/facturaelectronica-web/package-lock.json

      - name: Generate reports
        run: |
          ./mvnw -B clean verify
          cd apps/facturaelectronica-web
          npm ci
          npm run coverage

      - name: Analyze
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: apps/facturaelectronica-web
        run: npx sonar-scanner-npm -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
